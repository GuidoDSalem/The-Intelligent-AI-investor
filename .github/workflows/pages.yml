# Publica la app en GitHub Pages.
# - En cada push a main: tests, build y deploy con el snapshot que está en el repo.
# - De lunes a viernes, después del cierre de Wall Street: regenera data/snapshot.json con datos de EDGAR y
#   precios de Yahoo, lo commitea y publica. Si la actualización falla, se publica igual el snapshot anterior.
# Requisitos (una sola vez): Settings → Pages → Source: "GitHub Actions", y el secreto SEC_USER_AGENT
# (Settings → Secrets and variables → Actions) con "Nombre Apellido email@dominio", que exige la SEC.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5" # 21:30 UTC = 17:30 en Nueva York (horario de verano), 18:30 en Buenos Aires
  workflow_dispatch:
    inputs:
      actualizar:
        description: "Regenerar el snapshot con datos de hoy"
        type: boolean
        default: true

permissions:
  contents: write # commitear el snapshot diario
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Actualizar snapshot (EDGAR + Yahoo)
        id: snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning::Falta el secreto SEC_USER_AGENT: se publica el snapshot que ya está en el repo."
            exit 1
          fi
          npm run snapshot

      - name: Commitear el snapshot
        if: steps.snapshot.outcome == 'success'
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "El snapshot no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Snapshot diario $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
